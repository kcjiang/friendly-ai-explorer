name: fae

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: fae_app_pgdb
    volumes:
      - ${FAE_DATA_DIR:-/opt/fae}/postgres/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migration_v2_email.sql:/docker-entrypoint-initdb.d/02_email.sql:ro
      - ./db/migration_v4_debug.sql:/docker-entrypoint-initdb.d/04_debug.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U admin -d fae_app_pgdb]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/kcjiang/fae}-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/fae_app_pgdb
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      ENVIRONMENT: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - ${FAE_DATA_DIR:-/opt/fae}/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/kcjiang/fae}-frontend:${IMAGE_TAG:-latest}
    environment:
      BACKEND_URL: http://backend:8000
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/nginx-health]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
