services:
  # ── PostgreSQL 16 + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fae_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: fae_app_pgdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/migration_v2_email.sql:/docker-entrypoint-initdb.d/02_email.sql:ro
      - ./db/migration_v4_debug.sql:/docker-entrypoint-initdb.d/04_debug.sql:ro
      - ./db/migration_v5_catalog.sql:/docker-entrypoint-initdb.d/05_catalog.sql:ro
      - ./db/migration_v6_tickets.sql:/docker-entrypoint-initdb.d/06_tickets.sql:ro
      - ./db/migration_v7_catalog_trash.sql:/docker-entrypoint-initdb.d/07_catalog_trash.sql:ro
      - ./db/migration_v8_ai_routing.sql:/docker-entrypoint-initdb.d/08_ai_routing.sql:ro
      - ./db/migration_v9_ai_diagnostics.sql:/docker-entrypoint-initdb.d/09_ai_diagnostics.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d fae_app_pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fae_network

  # ── FastAPI 后端 ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fae_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/fae_app_pgdb
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      ENVIRONMENT: development
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - fae_network

  # ── Next.js 前端 ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fae_frontend
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fae_network

networks:
  fae_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
